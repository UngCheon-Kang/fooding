spring:
  datasource:
    url: jdbc:mysql://localhost:3306/fooding
    username: root           # ← 네 MySQL 사용자 ID로 변경
    password: 0000       # ← 네 MySQL 비밀번호로 변경
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
